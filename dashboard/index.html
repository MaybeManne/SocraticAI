<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compare</title>
<style>
  :root { --border:#e8eaef; --text:#1c1e26; --dim:#9094a2; --accent:#4f46e5;
          --accent-soft:#eef2ff; --green:#0a8a5f; --soft:#f8f9fb; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--text);
         font:14px/1.5 -apple-system, "Segoe UI", sans-serif; display:flex; height:100vh; overflow:hidden; }

  aside { width:240px; min-width:240px; border-right:1px solid var(--border);
          display:flex; flex-direction:column; }
  aside .top { padding:14px 12px 8px; }
  #search { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:9px;
            font-size:13px; outline:none; }
  #search:focus { border-color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:5px; padding:8px 12px; }
  .chip { padding:3px 10px; border-radius:20px; cursor:pointer; font-size:12px; color:var(--dim); }
  .chip.on { background:var(--accent-soft); color:var(--accent); font-weight:650; }
  #list { flex:1; overflow-y:auto; padding:2px 6px 16px; }
  .vitem { display:flex; align-items:center; padding:6px 10px; border-radius:8px;
           cursor:pointer; font-size:13px; }
  .vitem:hover { background:var(--soft); }
  .vitem.sel { background:var(--accent); color:#fff; }
  .vitem .tag { font-size:10px; color:var(--dim); margin-left:auto; }
  .vitem.sel .tag { color:rgba(255,255,255,.7); }
  #showAll { margin:6px 12px 14px; font-size:12px; color:var(--dim); background:none;
             border:none; cursor:pointer; text-align:left; padding:0; }
  #showAll:hover { color:var(--accent); }

  main { flex:1; overflow-y:auto; padding:12px 18px; }
  .bar { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  button { background:#fff; color:var(--text); border:1px solid var(--border);
           border-radius:9px; padding:6px 12px; cursor:pointer; font-size:13px; font-family:inherit; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary:hover { color:#fff; }
  .muted { color:var(--dim); }
  .tab2 { cursor:pointer; padding:4px 11px; border-radius:7px; color:var(--dim); font-size:13px; }
  .tab2.active { color:var(--accent); font-weight:700; }

  #empty { padding:110px 20px; text-align:center; color:var(--dim); font-size:15px; }
  .videos { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(330px, 1fr)); }
  .vslot { border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .vtitle { display:flex; align-items:center; gap:8px; padding:6px 10px; font-weight:600; font-size:13px; }
  .letter { min-width:19px; height:19px; border-radius:6px; text-align:center;
            line-height:19px; font-size:11px; background:var(--accent); color:#fff; }
  .vtitle .x { margin-left:auto; border:none; background:none; color:var(--dim); font-size:14px; padding:0 3px; }
  .vslot iframe, .vslot video { width:100%; height:400px; border:0; background:#000; display:block; }

  .panel { margin-top:12px; border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  h3 { margin:0 0 8px; font-size:11px; letter-spacing:.08em; color:var(--dim);
       text-transform:uppercase; font-weight:650; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; padding:5px 8px; color:var(--dim); font-size:11px;
       text-transform:uppercase; letter-spacing:.03em; font-weight:600;
       border-bottom:1px solid var(--border); }
  td { padding:6px 8px; border-bottom:1px solid var(--soft); vertical-align:top; }
  .best { font-weight:700; }
  .sc { display:inline-block; min-width:44px; text-align:center; padding:1px 7px;
        border-radius:6px; font-size:12px; font-weight:600; }
  .sc-hi  { background:#e6f6ee; color:#0a8a5f; }
  .sc-mid { background:#fdf3dc; color:#9a6b00; }
  .sc-lo  { background:#fdeaea; color:#b3352e; }
  .legend { font-size:12px; color:var(--dim); margin-top:8px; line-height:1.6; }
  .badge { display:inline-block; padding:0 7px; border-radius:6px; font-size:11px; font-weight:600;
           background:var(--accent-soft); color:var(--accent); }
  .btie { background:var(--soft); color:var(--dim); }

  .vgrid { display:grid; grid-template-columns:150px auto 1fr; gap:6px 12px; align-items:center; }
  .vgrid.nonotes { grid-template-columns:150px auto; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:6px 18px; }
  .seg button.on { background:var(--accent); color:#fff; }
  .vgrid input { border:1px solid var(--border); border-radius:7px; padding:5px 8px; font-size:12px; width:100%; }
  .quick { display:flex; gap:6px; margin-bottom:10px; align-items:center; }
  #saveMsg { color:var(--green); font-size:12px; margin-left:8px; }
  details summary { cursor:pointer; font-size:11px; color:var(--dim); text-transform:uppercase;
                    letter-spacing:.08em; padding:3px 0; }
  .fb button { padding:0 6px; font-size:11px; margin-left:3px; }
  .fb button.on { border-color:var(--green); color:var(--green); }
  .fb button.off { border-color:#c0392b; color:#c0392b; }
  .lbbar { height:5px; background:var(--soft); border-radius:4px; overflow:hidden; min-width:90px; }
  .lbbar > div { height:100%; background:var(--accent); }
  .spin { display:inline-block; width:13px; height:13px; border:2px solid var(--accent-soft);
          border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite;
          vertical-align:-2px; margin-right:7px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  #judgeStatus { font-size:13px; margin-left:10px; }
  #judgeStatus.err { color:#c0392b; }
</style>
</head>
<body>

<aside>
  <div class="top"><input id="search" placeholder="Search 91 videos…"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <button id="showAll">Show all versions…</button>
</aside>

<main>
  <div class="bar">
    <div class="tab2 active" data-tab="compare">Compare</div>
    <div class="tab2" data-tab="leaderboard">Leaderboard</div>
    <span style="flex:1"></span>
    <button id="nextPair" class="primary">Suggest a pair</button>
    <button id="clearAll">Clear</button>
  </div>

  <section id="compare">
    <div id="empty">Pick videos on the left to compare them.</div>
    <div class="videos" id="grid"></div>

    <div class="panel" id="metricsPanel" style="display:none">
      <h3>Judge metrics</h3>
      <div id="metricsBody"></div>
    </div>

    <div class="panel" id="verdictPanel" style="display:none">
      <div style="display:flex; align-items:center; margin-bottom:10px">
        <button id="runJudge" class="primary">⚖ Run AI judge on this pair</button>
        <span id="judgeStatus"></span>
      </div>
      <h3>Your verdict</h3>
      <div class="quick">
        <button data-fill="A">A sweeps</button>
        <button data-fill="tie">All tie</button>
        <button data-fill="B">B sweeps</button>
        <button id="notesToggle" style="margin-left:auto">＋ notes</button>
      </div>
      <div class="vgrid nonotes" id="verdictRows"></div>
      <div style="margin-top:10px">
        <button id="submitVerdict" class="primary">Submit</button><span id="saveMsg"></span>
      </div>
      <details id="judgeDetails" style="display:none; margin-top:10px">
        <summary>Machine judge said…</summary>
        <table id="judgeTable"></table>
      </details>
    </div>
  </section>

  <section id="leaderboard" style="display:none">
    <div class="bar">
      <button class="lbsub primary" data-s="circles">circles</button>
      <button class="lbsub" data-s="archer">archer</button>
      <button class="lbsub" data-s="binsearch">binsearch</button>
      <select id="lbDim" style="border:1px solid var(--border); border-radius:9px; padding:6px 10px; margin-left:8px">
        <option value="overall">overall</option>
        <option>visual_accuracy</option><option>interactivity</option>
        <option>narration_quality</option><option>sync</option>
        <option>concept_accuracy</option><option>polish</option>
      </select>
    </div>
    <div class="panel" id="lbBody"></div>
  </section>
</main>

<script>
const DIMS = ["visual_accuracy","interactivity","narration_quality","sync","concept_accuracy","polish"];
let CATALOG = [], selected = [], verdict = {}, judgeFb = {},
    subjectFilter = "circles", showAll = false, notesOn = false;
const $ = id => document.getElementById(id);
const api = (p, o) => fetch(p, o).then(r => r.json());
const item = id => CATALOG.find(i => i.id === id);

// A curated sidebar: the videos you actually compare (main variants +
// external tools). Everything else appears with "Show all versions".
const PRIMARY = /_(v\d|veo3|mathgpt|notebooklm|videotutor)$/;

document.querySelectorAll(".tab2").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab2").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  $("compare").style.display = t.dataset.tab === "compare" ? "" : "none";
  $("leaderboard").style.display = t.dataset.tab === "leaderboard" ? "" : "none";
  if (t.dataset.tab === "leaderboard") loadLeaderboard();
});

async function init() {
  CATALOG = await api("/api/videos");
  $("search").placeholder = `Search ${CATALOG.length} videos…`;
  const subjects = [...new Set(CATALOG.map(i => i.subject))];
  $("chips").innerHTML = "";
  for (const s of subjects) {
    const c = document.createElement("div");
    c.className = "chip" + (s === subjectFilter ? " on" : "");
    c.textContent = s;
    c.onclick = () => { subjectFilter = s;
      document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
      c.classList.add("on"); renderList(); };
    $("chips").appendChild(c);
  }
  $("search").oninput = renderList;
  $("showAll").onclick = () => { showAll = !showAll;
    $("showAll").textContent = showAll ? "Show fewer…" : "Show all versions…"; renderList(); };
  $("nextPair").onclick = async () => {
    const p = await api("/api/next_pair");
    if (p.a) { selected = [p.a, p.b]; render(); renderList(); }
  };
  $("clearAll").onclick = () => { selected = []; render(); renderList(); };
  renderList();
}

function sortKey(id) {
  // v7 first, then v6..v1, then externals, then the rest
  const m = id.match(/_v(\d+)(\.\d+)?$/);
  if (m) return 100 - +m[1];
  if (/veo3|mathgpt|notebooklm|videotutor/.test(id)) return 200;
  return 300;
}

function renderList() {
  const q = $("search").value.toLowerCase();
  const host = $("list");
  host.innerHTML = "";
  const items = CATALOG
    .filter(it => q ? it.id.toLowerCase().includes(q)
                    : it.subject === subjectFilter && (showAll || PRIMARY.test(it.id) || selected.includes(it.id)))
    .sort((a, b) => sortKey(a.id) - sortKey(b.id));
  for (const it of items) {
    const el = document.createElement("div");
    el.className = "vitem" + (selected.includes(it.id) ? " sel" : "");
    el.innerHTML = `<span>${it.id.replace(/^misc_/, "")}</span>
      <span class="tag">${it.kind === "video" ? "ext" : ""}</span>`;
    el.onclick = () => {
      selected.includes(it.id) ? selected = selected.filter(x => x !== it.id) : selected.push(it.id);
      render(); renderList();
    };
    host.appendChild(el);
  }
  if (!items.length) host.innerHTML = "<div class='vitem muted'>no matches</div>";
}

function render() {
  $("empty").style.display = selected.length ? "none" : "";
  const grid = $("grid");
  grid.innerHTML = "";
  selected.forEach((id, idx) => {
    const it = item(id);
    const slot = document.createElement("div");
    slot.className = "vslot";
    slot.innerHTML = `<div class="vtitle"><span class="letter">${String.fromCharCode(65+idx)}</span>
      ${it.id.replace(/^misc_/, "")}<button class="x">✕</button></div>`;
    slot.querySelector(".x").onclick = () => { selected = selected.filter(x => x !== id); render(); renderList(); };
    const media = it.kind === "video"
      ? Object.assign(document.createElement("video"), { src: it.url, controls: true, preload: "metadata" })
      : Object.assign(document.createElement("iframe"), { src: it.url });
    slot.appendChild(media);
    grid.appendChild(slot);
  });
  loadMetrics();
  setupVerdict();
}

async function loadMetrics() {
  const panel = $("metricsPanel");
  const scored = selected.filter(id => item(id).subject !== "misc");
  if (!scored.length) { panel.style.display = "none"; return; }
  panel.style.display = "";

  // ── 1. REAL judged performance (from actual verdicts, not rank) ──
  const stats = {};
  for (const id of scored) stats[id] = await api(`/api/stats/${encodeURIComponent(id)}`);
  const recChip = (rec) => {
    const n = rec.w + rec.l + rec.t;
    if (!n) return "<span class='muted' title='never judged on this dimension'>—</span>";
    const ratio = (rec.w + rec.t * 0.5) / n;
    const cls = ratio >= 0.66 ? "sc-hi" : ratio >= 0.33 ? "sc-mid" : "sc-lo";
    return `<span class="sc ${cls}" title="won ${rec.w}, lost ${rec.l}, tied ${rec.t} of ${n} judged matches">${rec.w}/${n}</span>`;
  };
  let html = `<table><tr><th>video</th><th>overall</th>` +
    DIMS.map(d => `<th>${d.split("_")[0]}</th>`).join("") + `<th>matches</th></tr>`;
  for (const id of scored) {
    const st = stats[id];
    html += `<tr><td><b>${id}</b></td><td>${recChip(st.overallRecord)}</td>` +
      DIMS.map(d => `<td>${recChip(st.dimRecord[d])}</td>`).join("") +
      `<td class="muted">${st.matches.length}</td></tr>`;
  }
  html += `</table><div class="legend">Cells show <b>dimension wins / judged matches</b> — real
    judge verdicts. <span class="sc sc-hi">won most</span> <span class="sc sc-mid">contested</span>
    <span class="sc sc-lo">lost most</span> • — = never judged. Few matches = weak evidence.</div>`;

  // ── 2. leaderboard rank (derived from match record) ──
  const subjects = [...new Set(scored.map(id => item(id).subject))];
  const rankings = {};
  for (const sj of subjects) rankings[sj] = await api(`/api/rankings/${sj}`);
  html += `<h3 style="margin-top:14px">Leaderboard rank <span class="muted" style="text-transform:none;letter-spacing:0">
    (Bradley-Terry, derived from win/loss record only — not a quality score)</span></h3>
    <table><tr><th>video</th><th>rank in subject</th><th>strength</th><th>record</th></tr>`;
  for (const id of scored) {
    const r = rankings[item(id).subject];
    const rows = (r && r.overall) || [];
    const i = rows.findIndex(x => x.id === id);
    const row = rows[i];
    html += `<tr><td><b>${id}</b></td>
      <td>${i >= 0 ? "#" + (i+1) + " of " + rows.length : "<span class='muted'>unranked</span>"}</td>
      <td class="muted">${row ? (row.score*100).toFixed(1) : "—"}</td>
      <td class="muted">${row ? `${row.wins}-${row.losses}-${row.ties} (${row.comparisons} match${row.comparisons===1?"":"es"})` : "no matches"}</td></tr>`;
  }
  html += "</table>";

  // ── 3. head-to-head among the selected pairs ──
  const pairs = [];
  for (let i = 0; i < selected.length; i++)
    for (let j = i + 1; j < selected.length; j++) pairs.push([selected[i], selected[j]]);
  const h2h = [];
  for (const [a, b] of pairs) {
    const d = await api(`/api/pair/${encodeURIComponent(a)}/${encodeURIComponent(b)}`);
    if (d.judge) h2h.push({ a, b, j: d.judge, human: d.human.length });
  }
  if (h2h.length) {
    const w = x => x === "tie" ? `<span class="badge btie">tie</span>` : `<span class="badge">${x}</span>`;
    html += `<h3 style="margin-top:14px">Head-to-head</h3>
      <table><tr><th>pair</th><th>overall</th>` + DIMS.map(d=>`<th>${d.split("_")[0]}</th>`).join("") + `<th>human</th></tr>`;
    for (const { a, b, j, human } of h2h)
      html += `<tr><td>${a} <span class="muted">vs</span> ${b}</td><td>${w(j.aggregator.winner)}</td>` +
        DIMS.map(d => `<td>${w(j.dimensions[d].winner)}</td>`).join("") +
        `<td class="muted">${human || "—"}</td></tr>`;
    html += "</table>";
  }

  // ── 4. single video selected: full match history with real verdicts ──
  if (scored.length === 1) {
    const st = stats[scored[0]];
    if (st.matches.length) {
      const rb = x => x === "w" ? `<span class="badge" style="background:#e6f6ee;color:#0a8a5f">won</span>`
        : x === "l" ? `<span class="badge" style="background:#fdeaea;color:#b3352e">lost</span>`
        : `<span class="badge btie">tie</span>`;
      html += `<h3 style="margin-top:14px">All judged matches for ${scored[0]}</h3>
        <table><tr><th>opponent</th><th>overall</th>` + DIMS.map(d=>`<th>${d.split("_")[0]}</th>`).join("") + `</tr>`;
      for (const m of st.matches) {
        html += `<tr><td>${m.opponent}</td><td>${rb(m.overall.result)} <span class="muted">${m.overall.confidence ?? ""}</span></td>` +
          DIMS.map(d => `<td>${m.dimensions[d] ? rb(m.dimensions[d].result) : "<span class='muted'>—</span>"}</td>`).join("") + `</tr>`;
      }
      html += "</table>";
    }
  }

  $("metricsBody").innerHTML = html;
}

function setupVerdict() {
  const panel = $("verdictPanel");
  verdict = {}; judgeFb = {};
  if (selected.length !== 2) { panel.style.display = "none"; return; }
  panel.style.display = "";
  drawVerdictRows();
  document.querySelectorAll(".quick button[data-fill]").forEach(b => b.onclick = () => {
    for (const d of [...DIMS, "overall"]) pick(d, b.dataset.fill);
  });
  $("notesToggle").onclick = () => { notesOn = !notesOn;
    $("notesToggle").textContent = notesOn ? "－ notes" : "＋ notes"; drawVerdictRows(true); };
  $("submitVerdict").onclick = submitVerdict;
  $("saveMsg").textContent = "";
  $("runJudge").onclick = runJudge;
  $("judgeStatus").textContent = "";
  $("judgeStatus").className = "";
  loadJudgePanel();
}

async function runJudge() {
  const [a, b] = selected;
  const st = $("judgeStatus");
  $("runJudge").disabled = true;
  st.className = "";
  st.innerHTML = `<span class="spin"></span>Running judge — screenshots + 7 LLM calls, this may take a minute…`;
  try {
    const start = await api("/api/run_judge", { method: "POST", body: JSON.stringify({ a, b }) });
    if (start.error) throw new Error(start.error);
    while (true) {
      await new Promise(r => setTimeout(r, 3000));
      if (selected[0] !== a || selected[1] !== b) return;   // user moved on
      const j = await api(`/api/job/${start.job}`);
      if (j.status === "done") break;
      if (j.status === "error") throw new Error(j.error || "judge failed");
    }
    st.className = "";
    st.textContent = "done ✓ — metrics updated";
    await loadMetrics();
    await loadJudgePanel();
  } catch (e) {
    st.className = "err";
    st.textContent = "✗ " + e.message;
  } finally {
    $("runJudge").disabled = false;
  }
}

function drawVerdictRows(keep) {
  const host = $("verdictRows");
  const prevNotes = {};
  if (keep) host.querySelectorAll("[data-note]").forEach(i => prevNotes[i.dataset.note] = i.value);
  host.className = "vgrid" + (notesOn ? "" : " nonotes");
  host.innerHTML = "";
  for (const dim of [...DIMS, "overall"]) {
    host.insertAdjacentHTML("beforeend", `
      <div style="${dim==="overall"?"font-weight:650":""}">${dim.replace(/_/g," ")}</div>
      <div class="seg" data-dim="${dim}">
        <button data-w="A">A</button><button data-w="tie">tie</button><button data-w="B">B</button>
      </div>` + (notesOn ? `<input placeholder="note…" data-note="${dim}" value="${prevNotes[dim]||""}">` : ""));
  }
  host.querySelectorAll(".seg button").forEach(b => b.onclick = () => pick(b.parentElement.dataset.dim, b.dataset.w));
  for (const d in verdict) pick(d, verdict[d]);   // restore highlights
}

function pick(dim, w) {
  verdict[dim] = w;
  const seg = document.querySelector(`.seg[data-dim="${dim}"]`);
  if (seg) seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.w === w));
}

async function submitVerdict() {
  const [a, b] = selected;
  const resolve = w => w === "A" ? a : w === "B" ? b : "tie";
  const note = d => (document.querySelector(`[data-note="${d}"]`) || {}).value || null;
  const dims = {};
  for (const d of DIMS) {
    if (!verdict[d]) { $("saveMsg").textContent = `pick ${d.replace(/_/g," ")}`; return; }
    dims[d] = { winner: resolve(verdict[d]), note: note(d) };
  }
  if (!verdict.overall) { $("saveMsg").textContent = "pick overall"; return; }
  const r = await api("/api/verdict", { method: "POST", body: JSON.stringify({
    setupA: a, setupB: b, dimensions: dims,
    aggregator: { winner: resolve(verdict.overall), note: note("overall") } }) });
  $("saveMsg").textContent = r.saved ? "saved ✓" : (r.error || "error");
  loadMetrics();
}

async function loadJudgePanel() {
  const [a, b] = selected;
  const d = await api(`/api/pair/${encodeURIComponent(a)}/${encodeURIComponent(b)}`);
  const det = $("judgeDetails");
  if (!d.judge) { det.style.display = "none"; return; }
  det.style.display = ""; det.open = false;
  const j = d.judge;
  const badge = w => w === "tie" ? `<span class="badge btie">tie</span>`
    : `<span class="badge">${w === a ? "A" : "B"}</span>`;
  let html = `<tr><th>dimension</th><th>winner</th><th>conf</th><th>rationale</th><th>you</th></tr>`;
  const rows = [...DIMS.map(dm => [dm, j.dimensions[dm]]),
    ["overall", { winner: j.aggregator.winner, confidence: j.aggregator.confidence,
                  rationale: j.aggregator.explanation }]];
  for (const [dm, r] of rows)
    html += `<tr><td>${dm.replace(/_/g," ")}</td><td>${badge(r.winner)}</td>
      <td class="muted">${r.confidence ?? ""}</td><td class="muted">${r.rationale || ""}</td>
      <td class="fb" data-dim="${dm}"><button data-v="agree">👍</button><button data-v="disagree">👎</button></td></tr>`;
  $("judgeTable").innerHTML = html;
  $("judgeTable").querySelectorAll(".fb button").forEach(bn => bn.onclick = async () => {
    judgeFb[bn.parentElement.dataset.dim] = bn.dataset.v;
    bn.parentElement.querySelectorAll("button").forEach(x => x.classList.remove("on","off"));
    bn.classList.add(bn.dataset.v === "agree" ? "on" : "off");
    await api("/api/judge_feedback", { method: "POST",
      body: JSON.stringify({ setupA: a, setupB: b, feedback: judgeFb }) });
  });
}

let lbSubject = "circles";
document.querySelectorAll(".lbsub").forEach(b => b.onclick = () => {
  lbSubject = b.dataset.s;
  document.querySelectorAll(".lbsub").forEach(x => x.classList.remove("primary"));
  b.classList.add("primary");
  loadLeaderboard();
});
$("lbDim").onchange = loadLeaderboard;

async function loadLeaderboard() {
  const data = await api(`/api/rankings/${lbSubject}`);
  const dim = $("lbDim").value;
  const rows = dim === "overall" ? data.overall : (data.dimensions[dim] || []);
  if (!rows.length) { $("lbBody").innerHTML = "<p class='muted'>No judge data.</p>"; return; }
  const max = rows[0].score || 1;
  let html = `<table><tr><th>#</th><th>setup</th><th>score</th><th></th><th>W</th><th>L</th><th>T</th></tr>`;
  rows.forEach((r, i) => {
    html += `<tr><td class="${i===0?'best':'muted'}">${i+1}</td><td>${r.id}</td>
      <td>${(r.score*100).toFixed(1)}</td>
      <td><div class="lbbar"><div style="width:${(r.score/max*100).toFixed(0)}%"></div></div></td>
      <td>${r.wins}</td><td>${r.losses}</td><td>${r.ties}</td></tr>`;
  });
  $("lbBody").innerHTML = html + "</table>";
}

init();
</script>
</body>
</html>
