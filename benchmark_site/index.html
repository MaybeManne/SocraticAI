<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SocraticAI — Benchmark Videos</title>
<meta name="robots" content="noindex">
<style>
  :root { --border:#e8eaef; --text:#1c1e26; --dim:#9094a2; --accent:#4f46e5;
          --accent-soft:#eef2ff; --green:#0a8a5f; --soft:#f8f9fb; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--text);
         font:15px/1.5 -apple-system, "Segoe UI", sans-serif; }
  header { padding:28px 24px 6px; max-width:1080px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  header p { margin:0; color:var(--dim); font-size:14px; }
  main { max-width:1080px; margin:0 auto; padding:8px 24px 60px; }
  h2 { font-size:16px; margin:34px 0 4px; }
  .subj-sub { color:var(--dim); font-size:13px; margin:0 0 12px; }
  .grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); }
  .card { border:1px solid var(--border); border-radius:12px; padding:12px 14px;
          cursor:pointer; background:#fff; text-align:left; font:inherit; }
  .card:hover { border-color:var(--accent); }
  .card .name { font-weight:650; font-size:14px; }
  .badge { display:inline-block; margin-top:6px; padding:1px 9px; border-radius:20px;
           font-size:11px; font-weight:600; }
  .b-ours { background:var(--accent-soft); color:var(--accent); }
  .b-ext  { background:#fdf3dc; color:#9a6b00; }
  .play { float:right; color:var(--dim); font-size:13px; }

  details { margin:14px 0 0; }
  summary { cursor:pointer; color:var(--dim); font-size:13px; }
  table { border-collapse:collapse; font-size:13px; margin-top:8px; }
  th { text-align:left; padding:4px 14px 4px 0; color:var(--dim); font-size:11px;
       text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--border); }
  td { padding:4px 14px 4px 0; border-bottom:1px solid var(--soft); }
  .best { font-weight:700; }
  .muted { color:var(--dim); }

  /* lightbox */
  #overlay { position:fixed; inset:0; background:rgba(12,12,20,.88); display:none;
             align-items:center; justify-content:center; z-index:10; }
  #overlay.open { display:flex; }
  #box { width:min(1200px, 94vw); height:min(760px, 88vh); display:flex; flex-direction:column; }
  #boxbar { display:flex; align-items:center; gap:10px; color:#fff; padding:0 2px 8px; }
  #boxtitle { font-weight:650; }
  #boxbar button { background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:8px;
                   padding:6px 13px; cursor:pointer; font:inherit; font-size:13px; }
  #boxbar button:hover { background:rgba(255,255,255,.26); }
  #stage { flex:1; background:#000; border-radius:12px; overflow:hidden; }
  #stage video, #stage iframe { width:100%; height:100%; border:0; display:block; background:#000; }
</style>
</head>
<body>

<header>
  <h1>SocraticAI — Benchmark Videos</h1>
  <p>Every generated lesson (v1–v7) and external-tool video, per problem.
     Click to watch; ⤢ or double-click for fullscreen, Esc / ✕ to close.
     Read-only — leaderboard numbers are baked in from the AI-judge results at build time.</p>
</header>

<main id="app"></main>

<div id="overlay">
  <div id="box">
    <div id="boxbar">
      <span id="boxtitle"></span>
      <span style="flex:1"></span>
      <button id="fsBtn" title="Fullscreen">⤢ Fullscreen</button>
      <button id="closeBtn" title="Close (Esc)">✕ Close</button>
    </div>
    <div id="stage"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
const app = document.getElementById("app");

for (const subj of window.BENCH.subjects) {
  const ours = subj.items.filter(i => i.kind === "lesson").length;
  const ext = subj.items.length - ours;
  const sec = document.createElement("section");
  sec.innerHTML = `<h2>${subj.title}</h2>
    <p class="subj-sub">${ours} SocraticAI versions · ${ext} external tools</p>`;
  const grid = document.createElement("div");
  grid.className = "grid";
  for (const it of subj.items) {
    const card = document.createElement("button");
    card.className = "card";
    card.innerHTML = `<span class="play">▶</span><div class="name">${it.label}</div>
      <span class="badge ${it.kind === "lesson" ? "b-ours" : "b-ext"}">
        ${it.kind === "lesson" ? "SocraticAI" : "External tool"}</span>`;
    card.onclick = () => openItem(it, subj.title);
    grid.appendChild(card);
  }
  sec.appendChild(grid);

  const lb = subj.leaderboard || [];
  if (lb.length) {
    const det = document.createElement("details");
    let rows = "";
    lb.forEach((r, i) => {
      rows += `<tr><td class="${i === 0 ? "best" : "muted"}">${i + 1}</td>
        <td class="${i === 0 ? "best" : ""}">${r.id}</td>
        <td>${r.winRate}%</td>
        <td class="muted">${r.wins}-${r.losses}-${r.ties} (${r.matches} matches)</td></tr>`;
    });
    det.innerHTML = `<summary>Judge leaderboard — win rate (ties count half), from
      ${lb.reduce((s, r) => s + r.matches, 0) / 2} AI-judged head-to-head comparisons</summary>
      <table><tr><th>#</th><th>setup</th><th>win rate</th><th>record</th></tr>${rows}</table>`;
    sec.appendChild(det);
  }
  app.appendChild(sec);
}

const overlay = document.getElementById("overlay");
const stage = document.getElementById("stage");
let current = null;

function openItem(item, subjTitle) {
  document.getElementById("boxtitle").textContent = `${subjTitle} — ${item.label}`;
  stage.innerHTML = "";
  current = item.kind === "video"
    ? Object.assign(document.createElement("video"),
        { src: item.src, controls: true, autoplay: true, playsInline: true })
    : Object.assign(document.createElement("iframe"),
        { src: item.src, allow: "autoplay; fullscreen" });
  if (item.kind === "video") current.ondblclick = goFullscreen;
  stage.appendChild(current);
  overlay.classList.add("open");
}

function closeItem() {
  overlay.classList.remove("open");
  stage.innerHTML = "";   // stops playback
  current = null;
}

function goFullscreen() {
  (current || stage).requestFullscreen?.();
}

document.getElementById("closeBtn").onclick = closeItem;
document.getElementById("fsBtn").onclick = goFullscreen;
overlay.onclick = e => { if (e.target === overlay) closeItem(); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.fullscreenElement) closeItem();
});
</script>
</body>
</html>
